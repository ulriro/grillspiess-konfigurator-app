<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem("ms-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Mein Spiess – App-Prototyp | Sonne-Metzg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: desktop = phone prototype sticky left, proposal text right; phone = prototype full width, text below. Butcher-tile neutrals, Sonne-Metzg sun yellow + red. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#171816; --muted:#5C605A; --line:#D7DBD4;
  --sun:#F2B705; --sun-ink:#171816; --red:#C4161C; --wood:#C9975A; --wood-dark:#94673A;
  --tray:#F7F8F6; --tray-edge:#DCE0DA; --ok:#2F7D46;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121311; --surface:#1C1D1B; --ink:#F0F1EC; --muted:#A0A49C; --line:#30332E;
  --sun:#F5C02A; --sun-ink:#171816; --red:#EE5A5F; --wood:#C9975A; --wood-dark:#94673A;
  --tray:#262825; --tray-edge:#3A3D37; --ok:#5DBB7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121311; --surface:#1C1D1B; --ink:#F0F1EC; --muted:#A0A49C; --line:#30332E;
  --sun:#F5C02A; --sun-ink:#171816; --red:#EE5A5F; --wood:#C9975A; --wood-dark:#94673A;
  --tray:#262825; --tray-edge:#3A3D37; --ok:#5DBB7A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.02;text-wrap:balance;margin:0}
h1{font-size:clamp(44px,7vw,84px);font-weight:900;letter-spacing:.005em;text-transform:uppercase}
h2{font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h3{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:19px;max-width:62ch;color:var(--ink)}
.sunline{display:inline-block;background:var(--sun);color:var(--sun-ink);padding:0 .18em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- page layout ---------- */
.head{display:grid;gap:14px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:48px;align-items:start}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.proposal{display:grid;gap:44px;min-width:0}
section{display:grid;gap:14px;min-width:0}
section p{margin:0;max-width:66ch}
.hint{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr);gap:40px}.sticky{position:static}}

/* ---------- phone ---------- */
.phone{width:100%;max-width:392px;margin:0 auto;border-radius:44px;padding:10px;background:#0E0F0E;box-shadow:0 0 0 1px var(--line),0 30px 60px -30px rgba(0,0,0,.45)}
.screen{border-radius:34px;overflow:hidden;background:var(--bg);height:780px;display:flex;flex-direction:column;position:relative}
@media (max-width:440px){.phone{padding:0;background:none;box-shadow:none;border-radius:0}.screen{border-radius:18px;border:1px solid var(--line);height:760px}}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.sunmark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--display);font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.appbar-actions{display:flex;align-items:center;gap:8px}
.themebtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);cursor:pointer;padding:0}
.themebtn svg{width:17px;height:17px}
.themebtn:focus-visible,.cartpill:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.themebtn .i-sun{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}
:root[data-theme="dark"] .themebtn .i-moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .themebtn .i-sun{display:block}:root:not([data-theme="light"]) .themebtn .i-moon{display:none}}
.cartpill{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--bg);cursor:pointer;color:var(--ink)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px 4px 14px;font-size:12px;font-weight:600;color:var(--muted);display:grid;gap:3px;justify-items:center}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] svg{color:var(--red)}
.tabs button:focus-visible{outline:2px solid var(--sun);outline-offset:-4px}

/* ---------- builder ---------- */
.stage{margin:12px 12px 0;border-radius:16px;background:var(--tray);border:1px solid var(--tray-edge);padding:10px 0 8px;position:relative;touch-action:none;transition:box-shadow .15s}
.stage.over{box-shadow:0 0 0 3px var(--sun)}
.stage.full{box-shadow:0 0 0 3px var(--red)}
.stage-top{display:flex;justify-content:space-between;align-items:baseline;padding:0 14px;font-size:12px;color:var(--muted)}
.stage-top .free{font-family:var(--mono);font-weight:600;color:var(--ink)}
.stage-top .free.warn{color:var(--red)}
.track-wrap{position:relative;height:150px;margin:0 14px 0 30px}
.stick{position:absolute;left:-22px;right:-12px;top:50%;height:7px;margin-top:-3px;background:linear-gradient(180deg,#E2B57A,var(--wood) 45%,var(--wood-dark));clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);border-radius:2px 0 0 2px}
.piece{position:absolute;top:50%;transform:translate(0,-50%);cursor:grab;user-select:none;-webkit-user-drag:none;touch-action:none;transition:left .18s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.piece img{display:block;width:100%;height:auto;max-height:140px;object-fit:contain;pointer-events:none}
.piece.sel{outline:2px dashed var(--red);outline-offset:3px;border-radius:6px}
.piece.lifted{opacity:.25}
.caret{position:absolute;top:12px;bottom:12px;width:3px;margin-left:-1px;background:var(--sun);border-radius:2px;display:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--muted);pointer-events:none;padding:0 20px}
.ruler{position:relative;height:18px;margin:0 14px 0 30px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ruler i{position:absolute;top:0;width:1px;height:5px;background:var(--muted);opacity:.5}
.ruler i.l{height:8px;opacity:.9}
.ruler span{position:absolute;top:8px;transform:translateX(-50%)}
.mar-paprika .piece img{filter:saturate(1.35) sepia(.45) hue-rotate(-12deg) contrast(1.05)}
.mar-kraeuter .piece img{filter:saturate(.9) sepia(.25) hue-rotate(28deg)}

.selbar{margin:8px 12px 0;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.selbar .txt{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.btn.primary{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.btn.danger{color:var(--red)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:10px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 14px 0;font-weight:700}

.palette{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scroll-snap-type:x proximity}
.card{flex:none;width:92px;scroll-snap-align:start;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 6px 7px;display:grid;justify-items:center;gap:2px;cursor:grab;touch-action:pan-x;user-select:none;text-align:center}
.card .ph{height:56px;display:grid;place-items:center}
.card img{max-height:56px;max-width:74px;pointer-events:none;-webkit-user-drag:none}
.card .n{font-size:12px;font-weight:600;line-height:1.15;min-height:28px;display:grid;align-items:center}
.card .p{font-family:var(--mono);font-size:12px;font-weight:600}
.card .mm{font-size:10px;color:var(--muted);font-family:var(--mono)}
.card.nofit{opacity:.45}

.pricebar{margin-top:auto;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px 12px;display:grid;gap:8px}
.pricerow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.total{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9}
.total small{font-family:var(--mono);font-size:13px;font-weight:600;margin-right:4px}
.breakdown{font-size:12px;color:var(--muted);font-family:var(--mono);line-height:1.4;text-align:right}
.actions{display:flex;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{all:unset;cursor:pointer;width:34px;height:36px;text-align:center;font-size:20px;font-weight:700}
.stepper button:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
.stepper output{min-width:34px;text-align:center;font-family:var(--mono);font-weight:600}
.actions .btn.primary{flex:1;padding:9px 12px}
.bump{animation:bump .28s ease}
@keyframes bump{40%{transform:scale(1.06)}}

.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.ghost img{width:100%;height:auto;display:block}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.show{opacity:1}

/* ---------- other views ---------- */
.pad{padding:14px;display:grid;gap:12px}
.vcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;display:grid}
.vcard img.photo{width:100%;aspect-ratio:360/150;object-fit:cover;display:block}
.vbody{padding:10px 12px 12px;display:grid;gap:6px}
.vtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vtop h3{font-size:22px}
.vtop .p{font-family:var(--mono);font-weight:600}
.vbody p{margin:0;font-size:13px;color:var(--muted)}
.mini{position:relative;height:44px;border-radius:10px;background:var(--tray);border:1px solid var(--tray-edge)}
.mini .stick{left:6px;right:6px;height:4px;margin-top:-2px}
.mini .piece{cursor:default;transition:none;filter:none}
.mini .piece img{max-height:38px}
.line{display:grid;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.line .vtop h3{font-size:18px}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.sum .total{font-size:34px}
.field{display:grid;gap:4px;font-size:13px;font-weight:600}
.field input,.field select{font:inherit;font-weight:400;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--muted);margin:0}
.done{border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.adm{display:grid;grid-template-columns:44px minmax(0,1fr) 78px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.adm img{width:44px;height:36px;object-fit:contain}
.adm .n{font-size:14px;font-weight:600;line-height:1.2}
.adm .n small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11px}
.adm input{font:inherit;font-family:var(--mono);font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;text-align:right}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px}

/* ---------- proposal blocks ---------- */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s;list-style:none;padding:0;margin:0}
.flow li{border-top:3px solid var(--ink);padding-top:8px;display:grid;gap:4px;counter-increment:s}
.flow li::before{content:counter(s);font-family:var(--display);font-weight:900;font-size:28px;line-height:1;color:var(--red)}
.flow b{font-size:15px}
.flow span{font-size:14px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
tr:last-child td{border-bottom:0}
.formula{font-family:var(--mono);font-size:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sun);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start}
.box h3{font-size:19px}
.box p,.box li{font-size:14px;margin:0}
.box ul{margin:0;padding-left:18px;display:grid;gap:3px}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.rec{border:2px solid var(--ink)}
.rec .tag{color:var(--red);font-weight:600}
.phases{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.phases li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.phases li b{font-family:var(--display);font-size:20px;text-transform:uppercase;line-height:1.1}
.phases li span{font-size:15px}
.phases li em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin-top:2px}
@media (max-width:520px){.phases li{grid-template-columns:minmax(0,1fr);gap:4px}}
.qs{margin:0;padding-left:20px;display:grid;gap:6px;max-width:70ch}
code{font-family:var(--mono);font-size:.88em;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

[hidden]{display:none!important}
img{max-width:100%}
html,body{margin:0;min-height:100%}

body{display:grid;place-items:center;padding-block:28px;padding-inline:16px;-webkit-text-size-adjust:100%}
.demo{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center;width:100%;max-width:420px}
.demo>*{min-width:0;max-width:100%}
.phone,.screen{min-width:0}
.demo-head{text-align:center;display:grid;gap:4px}
.demo-head h1{font-size:44px}
.hint{max-width:36ch}
@media (max-width:500px){
  body{padding:0;display:block}
  html,body{overflow-x:hidden}
  .demo{display:block;max-width:none;gap:0}
  .demo-head,.hint{display:none}
  .phone{width:100%;padding:0;background:none;box-shadow:none;border-radius:0;max-width:none}
  .screen{border-radius:0;border:0;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
}
</style>
</head>
<body>
<div class="demo">
  <header class="demo-head">
    <div class="eyebrow">Sonne-Metzg Reiden · App-Prototyp</div>
    <h1>Mein <span class="sunline">Spiess</span></h1>
  </header>
  <div class="phone" id="phone">
        <div class="screen" id="screen">
          <div class="appbar">
            <div class="brand">
              <svg class="sunmark" viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--sun)"><circle cx="20" cy="20" r="9"/><g id="ray"><path d="M20 1l2.6 8h-5.2z"/></g><use href="#ray" transform="rotate(45 20 20)"/><use href="#ray" transform="rotate(90 20 20)"/><use href="#ray" transform="rotate(135 20 20)"/><use href="#ray" transform="rotate(180 20 20)"/><use href="#ray" transform="rotate(225 20 20)"/><use href="#ray" transform="rotate(270 20 20)"/><use href="#ray" transform="rotate(315 20 20)"/></g><circle cx="20" cy="20" r="5.5" fill="var(--red)"/></svg>
              <div><b>Mein Spiess</b><small>Sonne-Metzg · Reiden</small></div>
            </div>
            <div class="appbar-actions">
              <button class="themebtn" id="themeBtn" type="button" aria-label="Helles oder dunkles Design"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
              <button class="cartpill num" id="cartPill" type="button">Korb 0</button>
            </div>
          </div>

          <div class="view" id="v-build"></div>
          <div class="view" id="v-tpl" hidden></div>
          <div class="view" id="v-cart" hidden></div>
          <div class="view" id="v-admin" hidden></div>

          <nav class="tabs" role="tablist">
            <button role="tab" data-v="tpl" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/></svg>Vorlagen</button>
            <button role="tab" data-v="build" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h17l3 0"/><rect x="5" y="8" width="4" height="8" rx="1.5"/><rect x="11" y="7" width="4" height="10" rx="1.5"/></svg>Spiess bauen</button>
            <button role="tab" data-v="cart" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16l-2 10H6z"/><circle cx="9" cy="20" r="1.4"/><circle cx="16" cy="20" r="1.4"/></svg>Warenkorb</button>
            <button role="tab" data-v="admin" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2.5"/></svg>Sortiment</button>
          </nav>
          <div class="toast" id="toast" role="status"></div>
        </div>
      </div>
  <p class="hint">Zutat aus der Leiste nach oben auf den Spiess ziehen, oder antippen. Stück auf dem Spiess antippen zum Entfernen, ziehen zum Umstecken.</p>
</div>
<script>

const state = {
  pieces: ["k-cippi-halb","s-hals","peperoni-rot","r-hohruecken","zucchetti","s-medaillon"].map(mk),
  mar: "nature", qty: 1, cat: "alle", sel: null, cart: [], view: "build", uid: 100
};
function mk(id){ mk.n = (mk.n || 0) + 1; return {uid: mk.n, id}; }
const byId = id => ING.find(i => i.id === id);
const r05 = v => Math.round(v * 20) / 20;
const chf = v => r05(v).toFixed(2);
const usedMm = list => list.reduce((s,p) => s + (byId(p.id)?.mm || 0), 0);
function unitPrice(ids, mar){
  const m = MARINADES.find(x => x.id === mar);
  return BASE.price + ids.reduce((s,id) => s + (byId(id)?.price || 0), 0) + (m ? m.price : 0);
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- builder view ---------------- */
const vb = $("#v-build");
vb.innerHTML = `
  <div class="stage" id="stage">
    <div class="stage-top"><span>Holzspiess 25 cm</span><span class="free" id="free"></span></div>
    <div class="track-wrap" id="track"><div class="stick"></div><div class="caret" id="caret"></div><div class="empty" id="empty">Nur der Holzspiess. Zutat hierher ziehen.</div></div>
    <div class="ruler" id="ruler"></div>
  </div>
  <div class="selbar" id="selbar"></div>
  <div class="label">Marinade</div>
  <div class="chips" id="mars"></div>
  <div class="label">Zutaten</div>
  <div class="chips" id="cats"></div>
  <div class="palette" id="palette"></div>
  <div class="pricebar">
    <div class="pricerow">
      <div class="total num" id="total"></div>
      <div class="breakdown" id="breakdown"></div>
    </div>
    <div class="actions">
      <div class="stepper"><button type="button" id="qm" aria-label="Weniger">−</button><output id="qty" class="num">1</output><button type="button" id="qp" aria-label="Mehr">+</button></div>
      <button class="btn" type="button" id="clear">Leeren</button>
      <button class="btn primary" type="button" id="add">In den Korb</button>
    </div>
  </div>`;
const stage = $("#stage"), track = $("#track"), caret = $("#caret");

function scale(){ return track.clientWidth / CAP_MM; }

function renderRuler(){
  const r = $("#ruler"), w = track.clientWidth; let h = "";
  for (let cm = 0; cm <= CAP_MM/10; cm++){
    const x = cm*10*w/CAP_MM, l = cm % 5 === 0;
    h += `<i class="${l?"l":""}" style="left:${x}px"></i>` + (l ? `<span style="left:${x}px">${cm}</span>` : "");
  }
  h += `<span style="left:${w}px;transform:translateX(-30%)">cm</span>`;
  r.innerHTML = h;
}

function layout(gapAt = -1, gapMm = 0){
  const s = scale(); let x = 0;
  state.pieces.forEach((p, i) => {
    if (i === gapAt) x += gapMm;
    const el = track.querySelector(`[data-uid="${p.uid}"]`);
    const ing = byId(p.id); if (!el || !ing) return;
    el.style.left = (x * s) + "px";
    el.style.width = (ing.mm * s * 1.06) + "px";
    x += ing.mm;
  });
  if (gapAt >= 0){
    let cx = 0; for (let i = 0; i < gapAt; i++) cx += byId(state.pieces[i].id).mm;
    caret.style.display = "block"; caret.style.left = (cx * s) + "px";
  } else caret.style.display = "none";
}

function renderStage(){
  track.querySelectorAll(".piece").forEach(e => e.remove());
  state.pieces.forEach(p => {
    const ing = byId(p.id); if (!ing) return;
    const d = document.createElement("div");
    d.className = "piece" + (state.sel === p.uid ? " sel" : "");
    d.dataset.uid = p.uid; d.tabIndex = 0;
    d.setAttribute("role","button"); d.setAttribute("aria-label", ing.name + " auf dem Spiess, antippen zum Auswählen");
    d.innerHTML = `<img src="${ing.img}" alt="">`;
    track.appendChild(d);
  });
  stage.className = "stage mar-" + state.mar;
  $("#empty").hidden = state.pieces.length > 0;
  layout();
  const free = CAP_MM - usedMm(state.pieces), f = $("#free");
  f.textContent = free > 0 ? `noch ${(free/10).toFixed(1)} cm frei` : "Spiess ist voll";
  f.classList.toggle("warn", free < 15);
  renderSel(); renderPalette(); renderPrice();
}

function renderSel(){
  const sb = $("#selbar"), p = state.pieces.find(x => x.uid === state.sel);
  if (p){
    const ing = byId(p.id);
    sb.innerHTML = `<span class="txt"><b style="color:var(--ink)">${esc(ing.name)}</b> · CHF ${ing.price.toFixed(2)}</span><button class="btn small danger" type="button" id="rm">Abziehen</button>`;
    $("#rm").onclick = () => { state.pieces = state.pieces.filter(x => x.uid !== state.sel); state.sel = null; renderStage(); };
  } else {
    const n = state.pieces.length, g = state.pieces.reduce((s,p)=>s+(byId(p.id)?.g||0),0);
    sb.innerHTML = `<span class="txt num">${n} ${n===1?"Stück":"Stücke"} · ca. ${g} g Rohgewicht</span>`;
  }
}

function renderMars(){
  $("#mars").innerHTML = MARINADES.map(m => `<button class="chip" type="button" data-m="${m.id}" aria-pressed="${state.mar===m.id}">${esc(m.name)}${m.price?` +${m.price.toFixed(2)}`:""}</button>`).join("");
}
function renderCats(){
  $("#cats").innerHTML = [{id:"alle",name:"Alle"}].concat(CATS).map(c => `<button class="chip" type="button" data-c="${c.id}" aria-pressed="${state.cat===c.id}">${esc(c.name)}</button>`).join("");
}
function renderPalette(){
  const free = CAP_MM - usedMm(state.pieces);
  const list = ING.filter(i => i.active !== false && (state.cat === "alle" || i.cat === state.cat));
  $("#palette").innerHTML = list.map(i => `
    <div class="card${i.mm > free ? " nofit" : ""}" tabindex="0" role="button" data-id="${i.id}" aria-label="${esc(i.name)}, CHF ${i.price.toFixed(2)}, auf den Spiess stecken">
      <div class="ph"><img src="${i.img}" alt=""></div>
      <div class="n">${esc(i.name)}</div>
      <div class="p num">${i.price.toFixed(2)}</div>
      <div class="mm">${i.mm} mm</div>
    </div>`).join("");
}
function renderPrice(){
  const ids = state.pieces.map(p => p.id), unit = unitPrice(ids, state.mar);
  const ingSum = ids.reduce((s,id)=>s+(byId(id)?.price||0),0), m = MARINADES.find(x=>x.id===state.mar);
  const t = $("#total");
  t.innerHTML = `<small>CHF</small>${chf(unit * state.qty)}`;
  t.classList.remove("bump"); void t.offsetWidth; t.classList.add("bump");
  $("#breakdown").innerHTML = `Holzspiess ${BASE.price.toFixed(2)}<br>${ids.length} Zutaten ${ingSum.toFixed(2)}${m.price?`<br>${m.name} ${m.price.toFixed(2)}`:""}${state.qty>1?`<br>× ${state.qty} à ${chf(unit)}`:""}`;
  $("#qty").textContent = state.qty;
}

function insertIndexAt(clientX){
  const rect = track.getBoundingClientRect(), s = scale(), x = (clientX - rect.left) / s;
  let acc = 0;
  for (let i = 0; i < state.pieces.length; i++){
    const mm = byId(state.pieces[i].id).mm;
    if (x < acc + mm/2) return i;
    acc += mm;
  }
  return state.pieces.length;
}
function overStage(x, y){
  const r = stage.getBoundingClientRect();
  return x >= r.left - 10 && x <= r.right + 10 && y >= r.top - 20 && y <= r.bottom + 10;
}
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 1700); }

function addPiece(id, at){
  const ing = byId(id), free = CAP_MM - usedMm(state.pieces);
  if (ing.mm > free){ toast(`Kein Platz mehr: ${ing.name} braucht ${ing.mm} mm`); return false; }
  const p = mk(id);
  if (at == null || at > state.pieces.length) state.pieces.push(p); else state.pieces.splice(at, 0, p);
  state.sel = null; renderStage(); return true;
}

/* ---- pointer drag (works for touch and mouse) ---- */
let drag = null;
function startGhost(ing, x, y){
  const g = document.createElement("div"); g.className = "ghost";
  g.style.width = (ing.mm * scale() * 1.06) + "px";
  g.innerHTML = `<img src="${ing.img}" alt="">`;
  if (state.mar !== "nature") g.firstChild.style.filter = getComputedStyle(track.querySelector(".piece img") || document.body).filter;
  document.body.appendChild(g); moveGhost(g, x, y); return g;
}
function moveGhost(g, x, y){ g.style.left = x + "px"; g.style.top = y + "px"; }

$("#palette").addEventListener("pointerdown", e => {
  const card = e.target.closest(".card"); if (!card || e.button > 0) return;
  drag = {kind:"new", id:card.dataset.id, x0:e.clientX, y0:e.clientY, started:false, pid:e.pointerId, card};
});
track.addEventListener("pointerdown", e => {
  const el = e.target.closest(".piece"); if (!el || e.button > 0) return;
  const uid = +el.dataset.uid, p = state.pieces.find(x => x.uid === uid);
  drag = {kind:"move", id:p.id, uid, x0:e.clientX, y0:e.clientY, started:false, pid:e.pointerId, el};
  el.setPointerCapture(e.pointerId);
});
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.started){
    if (Math.hypot(dx, dy) < 8) return;
    if (drag.kind === "new" && Math.abs(dx) > Math.abs(dy) * 1.2 && e.pointerType === "touch"){ drag = null; return; } // horizontales Scrollen
    drag.started = true;
    const ing = byId(drag.id);
    if (drag.kind === "move"){
      drag.from = state.pieces.findIndex(x => x.uid === drag.uid);
      drag.removed = state.pieces.splice(drag.from, 1)[0];
      drag.el.classList.add("lifted");
    }
    drag.ghost = startGhost(ing, e.clientX, e.clientY);
    try { drag.card && drag.card.setPointerCapture(e.pointerId); } catch(_){}
  }
  e.preventDefault();
  moveGhost(drag.ghost, e.clientX, e.clientY);
  const ing = byId(drag.id), fits = ing.mm <= CAP_MM - usedMm(state.pieces);
  if (overStage(e.clientX, e.clientY)){
    stage.classList.toggle("over", fits); stage.classList.toggle("full", !fits);
    if (fits){ drag.at = insertIndexAt(e.clientX); layout(drag.at, ing.mm); } else { drag.at = null; layout(); }
  } else { stage.classList.remove("over","full"); drag.at = null; layout(); }
}, {passive:false});
function endDrag(e){
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  stage.classList.remove("over","full");
  if (!d.started){
    if (e.type === "pointercancel") return;
    if (d.kind === "new"){ addPiece(d.id); }
    else { state.sel = state.sel === d.uid ? null : d.uid; renderStage(); }
    return;
  }
  d.ghost.remove();
  if (d.kind === "new"){
    if (d.at != null) addPiece(d.id, d.at); else layout();
  } else {
    if (d.at != null && e.type !== "pointercancel"){ state.pieces.splice(d.at, 0, d.removed); state.sel = null; }
    else if (e.type === "pointercancel"){ state.pieces.splice(d.from, 0, d.removed); }
    else { toast(`${byId(d.id).name} abgezogen`); state.sel = null; }
    renderStage();
  }
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

vb.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".card"), piece = e.target.closest(".piece");
  if (card){ e.preventDefault(); addPiece(card.dataset.id); }
  else if (piece){ e.preventDefault(); const u = +piece.dataset.uid; state.sel = state.sel === u ? null : u; renderStage(); }
});
$("#mars").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; state.mar = b.dataset.m; renderMars(); renderStage(); });
$("#cats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; state.cat = b.dataset.c; renderCats(); renderPalette(); });
$("#qm").onclick = () => { state.qty = Math.max(1, state.qty - 1); renderPrice(); };
$("#qp").onclick = () => { state.qty = Math.min(500, state.qty + 1); renderPrice(); };
$("#clear").onclick = () => { state.pieces = []; state.sel = null; state.tplName = null; renderStage(); };
$("#add").onclick = () => {
  if (!state.pieces.length){ toast("Erst mindestens eine Zutat anstecken"); return; }
  state.cart.push({name: state.tplName || "Eigener Spiess", ids: state.pieces.map(p=>p.id), mar: state.mar, qty: state.qty});
  toast(`${state.qty}× im Korb`); state.qty = 1; renderPrice(); renderCartPill();
};

/* ---------------- mini skewer (for lists) ---------------- */
function miniHTML(ids, mar){
  const total = CAP_MM; let x = 0, h = "";
  ids.forEach(id => { const ing = byId(id); if (!ing) return;
    h += `<div class="piece" style="left:calc(8px + (100% - 24px) * ${x/total});width:calc((100% - 24px) * ${ing.mm*1.06/total})"><img src="${ing.img}" alt=""></div>`; x += ing.mm; });
  return `<div class="mini mar-${mar}"><div class="stick"></div>${h}</div>`;
}

/* ---------------- templates ---------------- */
function renderTpl(){
  $("#v-tpl").innerHTML = `<div class="pad">${TEMPLATES.map((t,i) => `
    <article class="vcard">
      <img class="photo" src="${t.photo}" alt="${esc(t.name)} aus der Sonne-Metzg">
      <div class="vbody">
        <div class="vtop"><h3>${esc(t.name)}</h3><span class="p num">ab ${chf(unitPrice(t.items, t.mar))}</span></div>
        <p>${esc(t.text)} · ${t.items.length} Stücke</p>
        <button class="btn primary" type="button" data-t="${i}">Als Vorlage anpassen</button>
      </div>
    </article>`).join("")}</div>`;
}
$("#v-tpl").addEventListener("click", e => {
  const b = e.target.closest("[data-t]"); if (!b) return;
  const t = TEMPLATES[+b.dataset.t];
  state.pieces = t.items.map(mk); state.mar = t.mar; state.sel = null; state.tplName = t.name;
  renderMars(); renderStage(); show("build"); toast(`${t.name} geladen, jetzt anpassen`);
});

/* ---------------- cart ---------------- */
function renderCartPill(){ const n = state.cart.reduce((s,c)=>s+c.qty,0); $("#cartPill").textContent = `Korb ${n}`; }
function renderCart(){
  const v = $("#v-cart");
  if (!state.cart.length){
    v.innerHTML = `<div class="pad"><h3>Warenkorb</h3><p class="note">Noch leer. Unter „Spiess bauen“ einen Spiess zusammenstecken und „In den Korb“ tippen.</p></div>`; return;
  }
  const tot = state.cart.reduce((s,c)=>s + r05(unitPrice(c.ids,c.mar))*c.qty, 0);
  const tomorrow = new Date(Date.now()+86400000*2).toISOString().slice(0,10);
  v.innerHTML = `<div class="pad">
    ${state.cart.map((c,i) => `<div class="line">
      <div class="vtop"><h3>${esc(c.name)}</h3><span class="p mono num">${chf(r05(unitPrice(c.ids,c.mar))*c.qty)}</span></div>
      ${miniHTML(c.ids, c.mar)}
      <div class="vtop"><span class="note num">${c.ids.length} Stücke · ${MARINADES.find(m=>m.id===c.mar).name} · à ${chf(unitPrice(c.ids,c.mar))}</span>
        <div class="stepper"><button type="button" data-cm="${i}" aria-label="Weniger">−</button><output class="num">${c.qty}</output><button type="button" data-cp="${i}" aria-label="Mehr">+</button></div></div>
    </div>`).join("")}
    <div class="sum"><span>Total inkl. MWST</span><span class="total num"><small>CHF</small>${chf(tot)}</span></div>
    <form id="order" class="pad" style="padding:0">
      <div class="row2">
        <label class="field">Abholung am<input id="pickDate" type="date" required value="${tomorrow}"></label>
        <label class="field">Zeit<select id="pickTime"><option>09:00</option><option>11:00</option><option selected>16:00</option><option>17:30</option></select></label>
      </div>
      <label class="field">Name<input id="custName" required placeholder="Vor- und Nachname"></label>
      <button class="btn primary" type="submit">Bestellung senden</button>
      <p class="note">Abholung: Sonne-Metzg, Hauptstrasse 59, 6260 Reiden. Bezahlung im Laden.</p>
      <div id="orderDone"></div>
    </form></div>`;
}
$("#v-cart").addEventListener("click", e => {
  const m = e.target.closest("[data-cm]"), p = e.target.closest("[data-cp]");
  if (m){ const c = state.cart[+m.dataset.cm]; c.qty--; if (c.qty < 1) state.cart.splice(+m.dataset.cm,1); }
  else if (p){ state.cart[+p.dataset.cp].qty++; } else return;
  renderCart(); renderCartPill();
});
$("#v-cart").addEventListener("submit", e => {
  e.preventDefault();
  const n = state.cart.reduce((s,c)=>s+c.qty,0);
  $("#orderDone").innerHTML = `<div class="done">Prototyp: Hier ginge die Bestellung über ${n} Spiesse an die Metzg. Es wurde nichts gesendet.</div>`;
});

/* ---------------- admin / Sortiment ---------------- */
function placeholderImg(name, cat){
  const col = {wurst:"#E8C9B0", fleisch:"#B8463E", fisch:"#E9E4D6", gemuese:"#5E9B4A"}[cat] || "#C9975A";
  const ini = name.trim().slice(0,2).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="110"><rect x="4" y="4" width="72" height="102" rx="18" fill="${col}"/><text x="40" y="64" text-anchor="middle" font-family="Arial" font-weight="700" font-size="26" fill="#fff">${ini.replace(/[<&]/g,"")}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function renderAdmin(){
  $("#v-admin").innerHTML = `<div class="pad">
    <div><h3>Sortiment</h3><p class="note">Backoffice der Metzg (in der echten Lösung im Browser). Preise ändern wirkt sofort auf alle Spiesse und Vorlagen.</p></div>
    ${ING.map(i => `<div class="adm"><img src="${i.img}" alt=""><div class="n">${esc(i.name)}${i.isNew?'<span class="badge">neu</span>':""}<small>${CATS.find(c=>c.id===i.cat)?.name} · ${i.mm} mm</small></div><input type="number" step="0.05" min="0" inputmode="decimal" aria-label="Preis ${esc(i.name)}" data-pi="${i.id}" value="${i.price.toFixed(2)}"></div>`).join("")}
    <div class="adm"><img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="20"><rect y="7" width="80" height="6" rx="2" fill="#C9975A"/></svg>')}" alt=""><div class="n">${BASE.name}<small>Grundposition</small></div><input type="number" step="0.05" min="0" aria-label="Preis Holzspiess" data-base="1" value="${BASE.price.toFixed(2)}"></div>
    <form id="newIng" class="pad" style="padding:0">
      <h3>Neue Zutat</h3>
      <label class="field">Name<input id="niName" required value="Grillkäse"></label>
      <div class="row2">
        <label class="field">Kategorie<select id="niCat">${CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}<option value="kaese">Käse (neu)</option></select></label>
        <label class="field">Preis CHF<input id="niPrice" type="number" step="0.05" min="0" required value="0.90"></label>
      </div>
      <div class="row2">
        <label class="field">Breite mm<input id="niMm" type="number" min="5" max="80" required value="25"></label>
        <label class="field">Foto<input id="niImg" type="file" accept="image/*"></label>
      </div>
      <button class="btn primary" type="submit">Zutat freischalten</button>
    </form></div>`;
  const sel = $("#niCat"); if (sel) sel.value = "kaese";
}
$("#v-admin").addEventListener("change", e => {
  const t = e.target, v = parseFloat(t.value);
  if (isNaN(v) || v < 0) return;
  if (t.dataset.pi){ byId(t.dataset.pi).price = v; }
  else if (t.dataset.base){ BASE.price = v; } else return;
  renderPalette(); renderPrice(); renderTpl(); renderPriceTable();
  toast("Preis aktualisiert");
});
$("#v-admin").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#niName").value.trim(); if (!name) return;
  let cat = $("#niCat").value;
  if (!CATS.some(c => c.id === cat)){ CATS.push({id:cat, name: cat === "kaese" ? "Käse" : cat}); renderCats(); }
  const ing = {id:"x"+(++state.uid), name, cat, price: parseFloat($("#niPrice").value)||0, mm: Math.max(5, parseInt($("#niMm").value)||20), g: null, kg: null, isNew:true, img: placeholderImg(name, cat)};
  const f = $("#niImg").files[0];
  const finish = () => { ING.push(ing); renderAdmin(); renderPalette(); renderPriceTable(); toast(`${name} ist jetzt bestellbar`); };
  if (f){ const r = new FileReader(); r.onload = () => { ing.img = r.result; finish(); }; r.onerror = finish; r.readAsDataURL(f); } else finish();
});

/* ---------------- price table in proposal ---------------- */
function renderPriceTable(){
  if (!$("#priceTable")) return;
  $("#priceTable").innerHTML = ING.map(i => `<tr><td>${esc(i.name)}${i.isNew?'<span class="badge">neu</span>':""}</td><td>${esc(CATS.find(c=>c.id===i.cat)?.name||"")}</td><td class="r">${i.kg?i.kg+".–":"–"}</td><td class="r">${i.g?i.g+" g":"–"}</td><td class="r">${i.price.toFixed(2)}</td><td class="r">${i.mm} mm</td></tr>`).join("")
    + `<tr><td>${BASE.name}</td><td>Grundposition</td><td class="r">–</td><td class="r">–</td><td class="r">${BASE.price.toFixed(2)}</td><td class="r">210 mm nutzbar</td></tr>`;
}

/* ---------------- tabs ---------------- */
function show(v){
  state.view = v;
  ["build","tpl","cart","admin"].forEach(k => { $("#v-"+k).hidden = k !== v; });
  document.querySelectorAll(".tabs [role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
  if (v === "cart") renderCart();
  if (v === "tpl") renderTpl();
  if (v === "admin") renderAdmin();
  if (v === "build"){ renderRuler(); renderStage(); }
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) show(b.dataset.v); });
$("#cartPill").onclick = () => show("cart");
$("#themeBtn").onclick = () => {
  const root = document.documentElement, cur = root.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("ms-theme", next); } catch(_){}
  toast(next === "dark" ? "Dunkles Design" : "Helles Design");
};

renderMars(); renderCats(); renderPriceTable(); renderTpl();
show("build");
new ResizeObserver(() => { if (state.view === "build"){ renderRuler(); layout(); } }).observe(track);
})();
</script>
</body>
</html>
